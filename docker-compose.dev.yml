version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lol-analyzer-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lol_analyzer_root_password
      MYSQL_DATABASE: lol_analyzer
      MYSQL_USER: lol_analyzer_user
      MYSQL_PASSWORD: lol_analyzer_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - lol-analyzer-network

networks:
  lol-analyzer-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
